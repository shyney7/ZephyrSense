name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM
        uses: aminya/setup-cpp@v1
        with:
          llvm: "21"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          arch: win64_msvc2022_64
          modules: qtserialport qtlocation qtpositioning qtgraphs qtquick3d qtshadertools qtwebengine qtwebchannel
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build web assets
        working-directory: web
        run: npm ci && npm run build

      - name: Configure
        run: cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl

      - name: Build
        run: cmake --build build

  test:
    name: Test
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM
        uses: aminya/setup-cpp@v1
        with:
          llvm: "21"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          arch: win64_msvc2022_64
          modules: qtserialport qtlocation qtpositioning qtgraphs qtquick3d qtshadertools qtwebengine qtwebchannel
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build web assets
        working-directory: web
        run: npm ci && npm run build

      - name: Configure
        run: cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DWEBDEV_MODE=OFF -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl

      - name: Build
        run: cmake --build build

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

  lint-qml:
    name: QML Lint
    runs-on: windows-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM
        uses: aminya/setup-cpp@v1
        with:
          llvm: "21"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          arch: win64_msvc2022_64
          modules: qtserialport qtlocation qtpositioning qtgraphs qtquick3d qtshadertools qtwebengine qtwebchannel
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build web assets
        working-directory: web
        run: npm ci && npm run build

      - name: Configure
        run: cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl

      - name: Build
        run: cmake --build build

      - name: Run qmllint (filtered)
        run: powershell -ExecutionPolicy Bypass -File scripts/filter_qmllint_ci.ps1 -BuildDir build

  lint-cpp:
    name: C++ Lint
    runs-on: windows-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          arch: win64_msvc2022_64
          modules: qtserialport qtlocation qtpositioning qtgraphs qtquick3d qtshadertools qtwebengine qtwebchannel
          cache: true

      - name: Install LLVM
        uses: aminya/setup-cpp@v1
        with:
          llvm: "21"

      - name: Configure
        run: cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl

      - name: Build
        run: cmake --build build

      - name: Run clang-tidy
        shell: bash
        run: |
          find src -name '*.cpp' | xargs clang-tidy -p build --header-filter='^\.\./src/' 2>&1

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: windows-latest
    concurrency:
      group: codeql-${{ github.ref }}-${{ matrix.language }}
      cancel-in-progress: false
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: cpp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        if: matrix.language == 'cpp'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM
        if: matrix.language == 'cpp'
        uses: aminya/setup-cpp@v1
        with:
          llvm: "21"

      - name: Install Qt
        if: matrix.language == 'cpp'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          arch: win64_msvc2022_64
          modules: qtserialport qtlocation qtpositioning qtgraphs qtquick3d qtshadertools qtwebengine qtwebchannel
          cache: true

      - name: Setup Node.js
        if: matrix.language == 'cpp'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build web assets
        if: matrix.language == 'cpp'
        working-directory: web
        run: npm ci && npm run build

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          build-mode: ${{ matrix.build-mode }}
          config: |
            paths-ignore:
              - 'build'
              - 'libs'
              - 'web/node_modules'
              - 'web/public'

      - name: Configure
        if: matrix.build-mode == 'manual'
        run: cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl

      - name: Build
        if: matrix.build-mode == 'manual'
        run: cmake --build build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  lint-clazy:
    name: Clazy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          modules: qtserialport qtlocation qtpositioning qtgraphs qtquick3d qtshadertools qtwebengine qtwebchannel
          cache: true

      - name: Install clazy and Ninja
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clazy ninja-build

      - name: Configure
        run: >-
          cmake -B build -GNinja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clazy
          -DCMAKE_C_COMPILER=clang

      - name: Build with clazy
        env:
          CLAZY_CHECKS: >-
            level2,detaching-member,isempty-vs-count,reserve-candidates,
            signal-with-return-value,thread-with-slots,qvariant-template-instantiation,
            no-ctor-missing-parent-argument,no-missing-typeinfo,no-qproperty-without-notify
          CLAZY_IGNORE_DIRS: ".*kddockwidgets.*|.*KDDockWidgets.*"
          CLAZY_HEADER_FILTER: ".*ZephyrSense/src/.*"
          CCACHE_DISABLE: "ON"
        run: cmake --build build 2>&1 | tee clazy-output.log

      - name: Filter clazy results
        if: always()
        run: |
          echo "=== Clazy warnings from ZephyrSense sources ==="
          grep -E "(src/|main\.cpp).*warning:.*\[-Wclazy" clazy-output.log \
            | grep -iv kddockwidgets \
            && echo "::warning::Clazy found warnings in project sources" \
            || echo "No clazy warnings found."
