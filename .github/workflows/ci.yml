name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          arch: win64_msvc2022_64
          modules: qtserialport qtlocation qtpositioning qtcharts
          cache: true

      - name: Configure
        run: cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

  test:
    name: Test
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          arch: win64_msvc2022_64
          modules: qtserialport qtlocation qtpositioning qtcharts
          cache: true

      - name: Configure
        run: cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  lint-qml:
    name: QML Lint
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          arch: win64_msvc2022_64
          modules: qtserialport qtlocation qtpositioning qtcharts
          cache: true

      - name: Configure
        run: cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Run qmllint
        run: cmake --build build --target appZephyrSense_qmllint

  lint-cpp:
    name: C++ Lint
    runs-on: windows-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          arch: win64_msvc2022_64
          modules: qtserialport qtlocation qtpositioning qtcharts
          cache: true

      - name: Install LLVM
        uses: aminya/setup-cpp@v1
        with:
          clangtidy: true

      - name: Configure
        run: cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build

      - name: Run clang-tidy
        shell: bash
        run: |
          find src -name '*.cpp' | xargs clang-tidy -p build --header-filter='^\.\./src/' 2>&1

  codeql:
    name: CodeQL
    runs-on: windows-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          arch: win64_msvc2022_64
          modules: qtserialport qtlocation qtpositioning qtcharts
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          queries: security-and-quality
          config: |
            paths-ignore:
              - 'build'
              - 'libs'

      - name: Configure
        run: cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  lint-clazy:
    name: Clazy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          modules: qtserialport qtlocation qtpositioning qtcharts
          cache: true

      - name: Install clazy and Ninja
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clazy ninja-build

      - name: Configure
        run: >-
          cmake -B build -GNinja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clazy
          -DCMAKE_C_COMPILER=clang

      - name: Build with clazy
        env:
          CLAZY_CHECKS: >-
            level2,detaching-member,isempty-vs-count,reserve-candidates,
            signal-with-return-value,thread-with-slots,qvariant-template-instantiation,
            no-ctor-missing-parent-argument,no-missing-typeinfo,no-qproperty-without-notify
          CLAZY_IGNORE_DIRS: ".*kddockwidgets.*|.*KDDockWidgets.*"
          CLAZY_HEADER_FILTER: ".*ZephyrSense/src/.*"
          CCACHE_DISABLE: "ON"
        run: cmake --build build 2>&1 | tee clazy-output.log

      - name: Filter clazy results
        if: always()
        run: |
          echo "=== Clazy warnings from ZephyrSense sources ==="
          grep -E "(src/|main\.cpp).*warning:.*\[-Wclazy" clazy-output.log \
            | grep -iv kddockwidgets \
            && echo "::warning::Clazy found warnings in project sources" \
            || echo "No clazy warnings found."
