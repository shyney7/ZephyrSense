name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM
        uses: aminya/setup-cpp@v1
        with:
          llvm: "21"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          arch: win64_msvc2022_64
          modules: qtserialport qtlocation qtpositioning qtgraphs qtquick3d qtshadertools qtwebengine qtwebchannel
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build web assets
        working-directory: web
        run: npm ci && npm run build

      - name: Configure
        run: cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl

      - name: Build
        run: cmake --build build

  test:
    name: Test
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM
        uses: aminya/setup-cpp@v1
        with:
          llvm: "21"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          arch: win64_msvc2022_64
          modules: qtserialport qtlocation qtpositioning qtgraphs qtquick3d qtshadertools qtwebengine qtwebchannel
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build web assets
        working-directory: web
        run: npm ci && npm run build

      - name: Configure
        run: cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DWEBDEV_MODE=OFF -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl

      - name: Build
        run: cmake --build build

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

  lint-qml:
    name: QML Lint
    runs-on: windows-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM
        uses: aminya/setup-cpp@v1
        with:
          llvm: "21"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          arch: win64_msvc2022_64
          modules: qtserialport qtlocation qtpositioning qtgraphs qtquick3d qtshadertools qtwebengine qtwebchannel
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build web assets
        working-directory: web
        run: npm ci && npm run build

      - name: Configure
        run: cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl

      - name: Build
        run: cmake --build build

      - name: Run qmllint (filtered)
        run: powershell -ExecutionPolicy Bypass -File scripts/filter_qmllint_ci.ps1 -BuildDir build

  lint-cpp:
    name: C++ Lint
    runs-on: windows-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          arch: win64_msvc2022_64
          modules: qtserialport qtlocation qtpositioning qtgraphs qtquick3d qtshadertools qtwebengine qtwebchannel
          cache: true

      - name: Install LLVM
        uses: aminya/setup-cpp@v1
        with:
          llvm: "21"

      - name: Configure
        run: cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl

      - name: Build
        run: cmake --build build

      - name: Run clang-tidy
        shell: bash
        run: |
          find src -name '*.cpp' | xargs clang-tidy -p build --header-filter='^\.\./src/' 2>&1

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: windows-latest
    concurrency:
      group: codeql-${{ github.ref }}-${{ matrix.language }}
      cancel-in-progress: false
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: cpp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        if: matrix.language == 'cpp'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM
        if: matrix.language == 'cpp'
        uses: aminya/setup-cpp@v1
        with:
          llvm: "21"

      - name: Install Qt
        if: matrix.language == 'cpp'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          arch: win64_msvc2022_64
          modules: qtserialport qtlocation qtpositioning qtgraphs qtquick3d qtshadertools qtwebengine qtwebchannel
          cache: true

      - name: Setup Node.js
        if: matrix.language == 'cpp'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build web assets
        if: matrix.language == 'cpp'
        working-directory: web
        run: npm ci && npm run build

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          build-mode: ${{ matrix.build-mode }}
          config-file: .github/codeql/codeql-config.yml

      - name: Configure
        if: matrix.build-mode == 'manual'
        run: cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl

      - name: Build
        if: matrix.build-mode == 'manual'
        run: cmake --build build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results
          upload: failure-only

      - name: Filter generated files from SARIF
        if: matrix.language == 'cpp'
        uses: advanced-security/filter-sarif@v1
        with:
          patterns: |
            -build/**
            -libs/**
          input: sarif-results/cpp.sarif
          output: sarif-results/cpp.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif-results
          category: "/language:${{ matrix.language }}"

  lint-clazy:
    name: Clazy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          modules: qtserialport qtlocation qtpositioning qtgraphs qtquick3d qtshadertools qtwebengine qtwebchannel
          cache: true

      - name: Install clazy build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build clang-19 llvm-19-dev libclang-19-dev
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-19 200
          sudo update-alternatives --set clang++ /usr/bin/clang++-19
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-19 200
          sudo update-alternatives --set clang /usr/bin/clang-19

      - name: Resolve latest clazy tag
        id: clazy-tag
        run: |
          TAG=$(curl -s "https://api.github.com/repos/KDE/clazy/tags?per_page=1" \
            | grep '"name"' | head -1 | sed 's/.*"name": *"\(.*\)".*/\1/')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using clazy tag: $TAG"

      - name: Cache clazy
        id: cache-clazy
        uses: actions/cache@v4
        with:
          path: /opt/clazy
          key: clazy-clang19-${{ runner.os }}-${{ steps.clazy-tag.outputs.tag }}

      - name: Build clazy from source
        if: steps.cache-clazy.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/KDE/clazy.git --depth 1 --branch ${{ steps.clazy-tag.outputs.tag }}
          cmake -B clazy-build -S clazy -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/clazy -DLLVM_ROOT=/usr/lib/llvm-19
          cmake --build clazy-build -j$(nproc)
          sudo cmake --install clazy-build

      - name: Add clazy to PATH
        run: echo "/opt/clazy/bin" >> $GITHUB_PATH

      - name: Configure
        run: >-
          cmake -B build -GNinja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clazy
          -DCMAKE_C_COMPILER=clang-19

      - name: Build with clazy
        env:
          CLAZY_CHECKS: "level2,detaching-member,isempty-vs-count,reserve-candidates,signal-with-return-value,thread-with-slots,qvariant-template-instantiation,no-ctor-missing-parent-argument,no-missing-typeinfo,no-qproperty-without-notify"
          CLAZY_IGNORE_DIRS: ".*kddockwidgets.*|.*KDDockWidgets.*"
          CLAZY_HEADER_FILTER: ".*ZephyrSense/src/.*"
          CCACHE_DISABLE: "ON"
        run: cmake --build build 2>&1 | tee clazy-output.log

      - name: Filter clazy results
        if: always()
        run: |
          echo "=== Clazy warnings from ZephyrSense sources ==="
          grep -E "(src/|main\.cpp).*warning:.*\[-Wclazy" clazy-output.log \
            | grep -iv kddockwidgets \
            && echo "::warning::Clazy found warnings in project sources" \
            || echo "No clazy warnings found."
